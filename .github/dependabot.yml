version: 2
registries:
  maven-github:
    type: maven-repository
    url: https://maven.pkg.github.com/iwmedia/
    username: ${{secrets.PACKAGES_USERNAME}}
    password: ${{secrets.PACKAGES_PASSWORD}}
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Berlin"
    assignees:
      - "ByteExceptionM"
    reviewers:
      - "ByteExceptionM"
    registries:
      - "maven-github"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Berlin"
    assignees:
      - "ByteExceptionM"
    reviewers:
      - "ByteExceptionM"
